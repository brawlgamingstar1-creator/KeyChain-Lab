<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEYCHAIN LAB</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&family=Bebas+Neue&family=Orbitron:wght@700&family=Permanent+Marker&family=Playfair+Display:wght@700&family=Oswald:wght@700&family=Black+Ops+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#070707;--panel:#0d0d0d;--surf:#141414;--b1:#181818;--b2:#252525;--acc:#f06000;--gold:#e8a800;--grn:#00b85c;--txt:#cccccc;--dim:#555;--mut:#2a2a2a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'Share Tech Mono',monospace;font-size:12px;overflow:hidden}
.layout{display:flex;height:100vh}
.sidebar{width:300px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--b2);display:flex;flex-direction:column;overflow:hidden}
.sb-head{padding:13px 15px 11px;border-bottom:1px solid var(--b2);background:var(--surf)}
.logo{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:17px;letter-spacing:5px;color:var(--acc);line-height:1}
.logo-sub{font-size:7px;color:var(--dim);letter-spacing:3px;margin-top:2px}
.lang-row{display:flex;gap:4px;margin-top:10px}
.lng{background:transparent;border:1px solid var(--b2);color:var(--dim);font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:1px;padding:4px 8px;cursor:pointer;transition:all .12s}
.lng.active{border-color:var(--acc);color:var(--acc);background:rgba(240,96,0,.08)}
.lng:hover:not(.active){border-color:var(--dim);color:var(--txt)}
.sb-scroll{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--mut) transparent}
.sec{padding:11px 14px;border-bottom:1px solid var(--b1)}
.sec-lbl{font-size:7px;letter-spacing:3px;color:var(--acc);text-transform:uppercase;margin-bottom:9px;opacity:.85}
.field{margin-bottom:9px}
.field:last-child{margin-bottom:0}
.flbl{display:flex;justify-content:space-between;align-items:center;color:var(--dim);font-size:10px;letter-spacing:.3px;margin-bottom:4px}
.fval{color:var(--gold);font-family:'Share Tech Mono',monospace;font-size:10px}
input[type=text]{width:100%;background:#000;border:1px solid var(--b2);color:#fff;font-weight:700;font-size:17px;letter-spacing:3px;padding:7px 10px;outline:none;transition:border-color .15s;text-transform:uppercase}
input[type=text]:focus{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
input[type=text]::placeholder{color:var(--mut);font-size:12px;font-family:'Share Tech Mono',monospace;font-weight:400;letter-spacing:1px}
input[type=range]{width:100%;height:2px;-webkit-appearance:none;background:var(--b2);outline:none;cursor:pointer;border-radius:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;background:var(--acc);cursor:pointer;border-radius:50%;box-shadow:0 0 5px rgba(240,96,0,.4)}
.font-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.fpick{background:#000;border:1px solid var(--b2);color:#888;padding:5px 6px;cursor:pointer;transition:all .12s;text-align:center;min-height:36px;display:flex;align-items:center;justify-content:center;width:100%}
.fpick:hover{border-color:var(--dim);color:#fff}
.fpick.active{border-color:var(--acc);color:#fff;background:rgba(240,96,0,.07)}
.exp-area{padding:9px 14px 12px;background:var(--surf);border-top:1px solid var(--b2);display:flex;flex-direction:column;gap:4px}
.btn{display:flex;align-items:center;gap:8px;padding:8px 12px;background:transparent;border:1px solid;font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .13s;width:100%;text-align:left}
.btn-s{color:var(--acc);border-color:rgba(240,96,0,.35)}
.btn-s:hover{background:var(--acc);color:#000;border-color:var(--acc)}
.btn-m{color:var(--gold);border-color:rgba(232,168,0,.35)}
.btn-m:hover{background:var(--gold);color:#000;border-color:var(--gold)}
.btn-g{color:var(--grn);border-color:rgba(0,184,92,.35)}
.btn-g:hover{background:var(--grn);color:#000;border-color:var(--grn)}
.viewport{flex:1;position:relative;background:#030303;background-image:linear-gradient(rgba(240,96,0,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(240,96,0,.02) 1px,transparent 1px);background-size:36px 36px}
#c3d{width:100%;height:100%;display:block;cursor:grab}
#c3d:active{cursor:grabbing}
.hud{position:absolute;pointer-events:none}
.hud-tl{top:12px;left:12px}
.hud-br{bottom:12px;right:12px;text-align:right}
.chip{display:inline-flex;align-items:center;gap:7px;padding:4px 9px;border:1px solid var(--b2);background:rgba(7,7,7,.92);font-size:8px;letter-spacing:2px;color:var(--acc)}
.dot{width:5px;height:5px;background:var(--acc);border-radius:50%;animation:pu 1.6s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.2}}
.dims{font-size:8px;color:#2a2a2a;letter-spacing:1.5px;margin-top:4px;text-transform:uppercase}
.hint{font-size:7px;color:#1c1c1c;letter-spacing:2px;text-transform:uppercase}
</style>
</head>
<body>
<div class="layout">
  <div class="sidebar">
    <div class="sb-head">
      <div class="logo">KEYCHAIN LAB</div>
      <div class="logo-sub">STL · 3MF · GCODE GENERATOR</div>
      <div class="lang-row">
        <button class="lng active" onclick="setLang('cs')">🇨🇿 CZ</button>
        <button class="lng" onclick="setLang('en')">🇬🇧 EN</button>
        <button class="lng" onclick="setLang('es')">🇪🇸 ES</button>
      </div>
    </div>
    <div class="sb-scroll">
      <div class="sec">
        <div class="sec-lbl" data-k="secText"></div>
        <div class="field"><input type="text" id="iText" value="KLICENKA" maxlength="14"></div>
        <div class="field"><div class="flbl"><span data-k="lblTd"></span><span class="fval" id="v_td">1.0</span> mm</div><input type="range" id="s_td" min=".3" max="3" value="1" step=".1"></div>
      </div>
      <div class="sec">
        <div class="sec-lbl" data-k="secFont"></div>
        <div class="font-grid" id="fontGrid"></div>
      </div>
      <div class="sec">
        <div class="sec-lbl" data-k="secBody"></div>
        <div class="field"><div class="flbl"><span data-k="lblW"></span><span class="fval" id="v_w">80</span> mm</div><input type="range" id="s_w" min="30" max="120" value="80" step="2"></div>
        <div class="field"><div class="flbl"><span data-k="lblH"></span><span class="fval" id="v_h">25</span> mm</div><input type="range" id="s_h" min="15" max="50" value="25" step="1"></div>
        <div class="field"><div class="flbl"><span data-k="lblTh"></span><span class="fval" id="v_th">3.0</span> mm</div><input type="range" id="s_th" min="1.5" max="8" value="3" step=".5"></div>
        <div class="field"><div class="flbl"><span data-k="lblCr"></span><span class="fval" id="v_cr">3.0</span> mm</div><input type="range" id="s_cr" min="1" max="12" value="3" step=".5"></div>
      </div>
      <div class="sec">
        <div class="sec-lbl" data-k="secHole"></div>
        <div class="field"><div class="flbl"><span data-k="lblHo"></span><span class="fval" id="v_ho">5.0</span> mm</div><input type="range" id="s_ho" min="3" max="12" value="5" step=".5"></div>
      </div>
      <div class="sec">
        <div class="sec-lbl" data-k="secPrint"></div>
        <div class="field"><div class="flbl"><span data-k="lblLh"></span><span class="fval" id="v_lh">0.20</span> mm</div><input type="range" id="s_lh" min=".05" max=".4" value=".2" step=".05"></div>
        <div class="field"><div class="flbl"><span data-k="lblNw"></span><span class="fval" id="v_nw">0.40</span> mm</div><input type="range" id="s_nw" min=".2" max=".8" value=".4" step=".05"></div>
        <div class="field"><div class="flbl"><span data-k="lblPt"></span><span class="fval" id="v_pt">210</span> °C</div><input type="range" id="s_pt" min="170" max="290" value="210" step="5"></div>
        <div class="field"><div class="flbl"><span data-k="lblBt"></span><span class="fval" id="v_bt">60</span> °C</div><input type="range" id="s_bt" min="0" max="120" value="60" step="5"></div>
        <div class="field"><div class="flbl"><span data-k="lblSp"></span><span class="fval" id="v_sp">50</span> mm/s</div><input type="range" id="s_sp" min="20" max="150" value="50" step="5"></div>
      </div>
    </div>
    <div class="exp-area">
      <button class="btn btn-s" onclick="dlSTL()"><span>⬡</span>&nbsp;<span data-k="btnStl"></span></button>
      <button class="btn btn-m" onclick="dl3MF()"><span>◈</span>&nbsp;<span data-k="btn3mf"></span></button>
      <button class="btn btn-g" onclick="dlGCode()"><span>≡</span>&nbsp;<span data-k="btnGcode"></span></button>
    </div>
  </div>
  <div class="viewport">
    <canvas id="c3d"></canvas>
    <div class="hud hud-tl">
      <div class="chip"><div class="dot"></div><span id="stxt"></span></div>
      <div class="dims" id="dimTxt"></div>
    </div>
    <div class="hud hud-br"><div class="hint" id="hintTxt"></div></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
// ── I18N ─────────────────────────────────────────────────────
const LANGS={
  cs:{
    secText:'Text klíčenky', phText:'Váš text...',
    lblTd:'Hloubka textu', secFont:'Styl písma',
    secBody:'Rozměry těla', lblW:'Šířka', lblH:'Výška', lblTh:'Tloušťka', lblCr:'Zaoblení rohů',
    secHole:'Otvor pro kroužek', lblHo:'Průměr otvoru',
    secPrint:'Parametry tisku', lblLh:'Výška vrstvy', lblNw:'Průměr trysky',
    lblPt:'Teplota trysky', lblBt:'Teplota podložky', lblSp:'Rychlost',
    btnStl:'Stáhnout STL', btn3mf:'Stáhnout 3MF', btnGcode:'Stáhnout GCode',
    stReady:'PŘIPRAVEN', stGen:'GENEROVÁNÍ', stDone:'HOTOVO',
    stExpStl:'EXPORT STL…', stDlStl:'STL STAŽENO ✓',
    stExp3mf:'EXPORT 3MF…', stDl3mf:'3MF STAŽENO ✓',
    stExpGc:'GEN. GCODE…', stDlGc:'GCODE STAŽENO ✓',
    hint:'DRAG – ROTACE  ·  SCROLL – ZOOM  ·  RMB – PAN',
    gcDim:'Rozměry', gcLayer:'VRSTVA', gcBase:'ZÁKLAD', gcEnd:'KONEC',
    gcRec:'Pro nejlepší výsledky slicujte STL/3MF v PrusaSlicer nebo Cura'
  },
  en:{
    secText:'Keychain text', phText:'Your text...',
    lblTd:'Text depth', secFont:'Font style',
    secBody:'Body dimensions', lblW:'Width', lblH:'Height', lblTh:'Thickness', lblCr:'Corner radius',
    secHole:'Keyring hole', lblHo:'Hole diameter',
    secPrint:'Print settings', lblLh:'Layer height', lblNw:'Nozzle diameter',
    lblPt:'Nozzle temp', lblBt:'Bed temp', lblSp:'Speed',
    btnStl:'Download STL', btn3mf:'Download 3MF', btnGcode:'Download GCode',
    stReady:'READY', stGen:'GENERATING', stDone:'DONE',
    stExpStl:'EXPORTING STL…', stDlStl:'STL DOWNLOADED ✓',
    stExp3mf:'EXPORTING 3MF…', stDl3mf:'3MF DOWNLOADED ✓',
    stExpGc:'GEN. GCODE…', stDlGc:'GCODE DOWNLOADED ✓',
    hint:'DRAG – ROTATE  ·  SCROLL – ZOOM  ·  RMB – PAN',
    gcDim:'Dimensions', gcLayer:'LAYER', gcBase:'BASE', gcEnd:'END',
    gcRec:'For best results slice STL/3MF in PrusaSlicer or Cura'
  },
  es:{
    secText:'Texto del llavero', phText:'Tu texto...',
    lblTd:'Profundidad texto', secFont:'Estilo de fuente',
    secBody:'Dimensiones', lblW:'Ancho', lblH:'Alto', lblTh:'Grosor', lblCr:'Radio esquina',
    secHole:'Agujero llavero', lblHo:'Diámetro agujero',
    secPrint:'Parámetros impresión', lblLh:'Altura capa', lblNw:'Diám. boquilla',
    lblPt:'Temp. boquilla', lblBt:'Temp. cama', lblSp:'Velocidad',
    btnStl:'Descargar STL', btn3mf:'Descargar 3MF', btnGcode:'Descargar GCode',
    stReady:'LISTO', stGen:'GENERANDO', stDone:'HECHO',
    stExpStl:'EXPORT STL…', stDlStl:'STL DESCARGADO ✓',
    stExp3mf:'EXPORT 3MF…', stDl3mf:'3MF DESCARGADO ✓',
    stExpGc:'GEN. GCODE…', stDlGc:'GCODE DESCARGADO ✓',
    hint:'DRAG – ROTAR  ·  SCROLL – ZOOM  ·  RMB – PAN',
    gcDim:'Dimensiones', gcLayer:'CAPA', gcBase:'BASE', gcEnd:'FIN',
    gcRec:'Para mejores resultados, slicee STL/3MF en PrusaSlicer o Cura'
  }
};
let lang='cs';
function t(k){return LANGS[lang][k]||k;}

function applyLang(){
  document.querySelectorAll('[data-k]').forEach(el=>{
    const v=LANGS[lang][el.dataset.k];
    if(v!==undefined) el.textContent=v;
  });
  document.getElementById('iText').placeholder=t('phText');
  document.getElementById('hintTxt').textContent=t('hint');
  setSt(t('stReady'));
}
function setLang(l){
  lang=l;
  document.querySelectorAll('.lng').forEach(b=>{
    b.classList.toggle('active',b.getAttribute('onclick').includes("'"+l+"'"));
  });
  applyLang();
}

// ── FONTS ─────────────────────────────────────────────────────
const FONTS=[
  {id:'bebas',    css:"'Bebas Neue',sans-serif",        label:'BEBAS NEUE',  size:16},
  {id:'orbitron', css:"'Orbitron',sans-serif",           label:'ORBITRON',    size:12},
  {id:'oswald',   css:"'Oswald',sans-serif",             label:'OSWALD',      size:15},
  {id:'playfair', css:"'Playfair Display',serif",        label:'Playfair',    size:14},
  {id:'blackops', css:"'Black Ops One',sans-serif",      label:'BLACK OPS',   size:13},
  {id:'marker',   css:"'Permanent Marker',cursive",      label:'Marker',      size:14},
];
let selFont=FONTS[0];

function buildFontGrid(){
  const g=document.getElementById('fontGrid'); g.innerHTML='';
  FONTS.forEach(f=>{
    const btn=document.createElement('button');
    btn.className='fpick'+(f.id===selFont.id?' active':'');
    btn.innerHTML=`<span style="font-family:${f.css};font-size:${f.size}px;line-height:1.1">${f.label}</span>`;
    btn.title=f.label;
    btn.onclick=()=>{selFont=f;buildFontGrid();sched();};
    g.appendChild(btn);
  });
}

// ── THREE.JS RENDERER ─────────────────────────────────────────
const cvs=document.getElementById('c3d');
const R=new THREE.WebGLRenderer({canvas:cvs,antialias:true,alpha:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
R.shadowMap.enabled=true;
R.toneMapping=THREE.ACESFilmicToneMapping;
R.toneMappingExposure=1.1;
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(40,1,.1,2000);
scene.add(new THREE.AmbientLight(0xffffff,.28));
const dl1=new THREE.DirectionalLight(0xffa040,1.1); dl1.position.set(80,120,80); dl1.castShadow=true; scene.add(dl1);
const dl2=new THREE.DirectionalLight(0x4060ff,.45); dl2.position.set(-80,40,-60); scene.add(dl2);
scene.add(new THREE.HemisphereLight(0x0a0a20,0x050505,.7));
const grid=new THREE.GridHelper(300,30,0x181818,0x111111); scene.add(grid);
const grp=new THREE.Group(); scene.add(grp);
const matBase=new THREE.MeshStandardMaterial({color:0x909090,roughness:.22,metalness:.88});
const matTxt=new THREE.MeshStandardMaterial({color:0xff6200,roughness:.15,metalness:.5,emissive:0x992200,emissiveIntensity:.06});

// ── GEOMETRY ──────────────────────────────────────────────────
function rrShape(w,h,r){
  r=Math.min(r,w/2-.1,h/2-.1);
  const s=new THREE.Shape();
  s.moveTo(-w/2+r,-h/2); s.lineTo(w/2-r,-h/2);
  s.quadraticCurveTo(w/2,-h/2,w/2,-h/2+r);
  s.lineTo(w/2,h/2-r); s.quadraticCurveTo(w/2,h/2,w/2-r,h/2);
  s.lineTo(-w/2+r,h/2); s.quadraticCurveTo(-w/2,h/2,-w/2,h/2-r);
  s.lineTo(-w/2,-h/2+r); s.quadraticCurveTo(-w/2,-h/2,-w/2+r,-h/2);
  return s;
}



function buildTextGeo(text,aW,aH,depth,fontCss){
  // SC=6 → square pixels at 0.1mm; CH uses base 120 (not CW) to keep aspect ratio correct
  const SC=6;
  const BASE=120;
  const CW=Math.round(BASE*SC);
  const CH=Math.round(Math.max(8,BASE*aH/aW)*SC);
  const can=document.createElement('canvas'); can.width=CW; can.height=CH;
  const ctx=can.getContext('2d');
  ctx.fillStyle='#000'; ctx.fillRect(0,0,CW,CH);
  // render with slight blur → smoother letter edges after thresholding
  ctx.filter='blur(1.2px)';
  ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
  let fs=CH*.84;
  ctx.font=`bold ${fs}px ${fontCss}`;
  while(ctx.measureText(text).width>CW*.9&&fs>5){fs-=1;ctx.font=`bold ${fs}px ${fontCss}`;}
  ctx.fillText(text,CW/2,CH/2);
  const px=ctx.getImageData(0,0,CW,CH).data;
  const pw=aW/CW, ph=aH/CH;
  const pos=[],nor=[],idx=[];
  let vi=0;
  // helper: is pixel solid (above threshold)?
  const solid=(x,y)=>x>=0&&x<CW&&y>=0&&y<CH&&px[(y*CW+x)*4]>90;
  for(let py=0;py<CH;py++) for(let ex=0;ex<CW;ex++){
    if(!solid(ex,py)) continue;
    const cx=(ex+.5)/CW*aW-aW/2, cy=-((py+.5)/CH*aH-aH/2), cz=depth/2;
    const hw=pw/2, hh=ph/2, hd=depth/2;
    // only emit exposed faces (skip shared internal faces → far smoother result)
    const faces=[
      // top face (always visible – faces camera)
      {skip:false, n:[0,0,1], v:[[cx-hw,cy-hh,cz+hd],[cx+hw,cy-hh,cz+hd],[cx+hw,cy+hh,cz+hd],[cx-hw,cy+hh,cz+hd]]},
      // bottom face
      {skip:false, n:[0,0,-1],v:[[cx+hw,cy-hh,cz-hd],[cx-hw,cy-hh,cz-hd],[cx-hw,cy+hh,cz-hd],[cx+hw,cy+hh,cz-hd]]},
      // right side – only if right neighbour is empty
      {skip:solid(ex+1,py), n:[1,0,0], v:[[cx+hw,cy-hh,cz+hd],[cx+hw,cy-hh,cz-hd],[cx+hw,cy+hh,cz-hd],[cx+hw,cy+hh,cz+hd]]},
      // left side
      {skip:solid(ex-1,py), n:[-1,0,0],v:[[cx-hw,cy-hh,cz-hd],[cx-hw,cy-hh,cz+hd],[cx-hw,cy+hh,cz+hd],[cx-hw,cy+hh,cz-hd]]},
      // bottom edge (py increases downward in image, but +Y in world)
      {skip:solid(ex,py+1), n:[0,-1,0],v:[[cx+hw,cy-hh,cz+hd],[cx-hw,cy-hh,cz+hd],[cx-hw,cy-hh,cz-hd],[cx+hw,cy-hh,cz-hd]]},
      // top edge
      {skip:solid(ex,py-1), n:[0,1,0], v:[[cx-hw,cy+hh,cz+hd],[cx+hw,cy+hh,cz+hd],[cx+hw,cy+hh,cz-hd],[cx-hw,cy+hh,cz-hd]]},
    ];
    for(const f of faces){
      if(f.skip) continue;
      for(const v of f.v) pos.push(...v), nor.push(...f.n);
      idx.push(vi,vi+1,vi+2,vi,vi+2,vi+3); vi+=4;
    }
  }
  if(!pos.length) return null;
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pos),3));
  g.setAttribute('normal',new THREE.BufferAttribute(new Float32Array(nor),3));
  g.setIndex(new THREE.BufferAttribute(new Uint32Array(idx),1));
  return g;
}

// ── STATE ─────────────────────────────────────────────────────
let gBase=null, gText=null;
function gs(){return{
  text:document.getElementById('iText').value.trim()||'TEXT',
  td:+document.getElementById('s_td').value,
  w:+document.getElementById('s_w').value,
  h:+document.getElementById('s_h').value,
  th:+document.getElementById('s_th').value,
  cr:+document.getElementById('s_cr').value,
  ho:+document.getElementById('s_ho').value,
  lh:+document.getElementById('s_lh').value,
  nw:+document.getElementById('s_nw').value,
  pt:+document.getElementById('s_pt').value,
  bt:+document.getElementById('s_bt').value,
  sp:+document.getElementById('s_sp').value,
  font:selFont.css
};}

function rebuild(){
  const s=gs(); setSt(t('stGen'));
  grp.children.slice().forEach(c=>{if(c.geometry)c.geometry.dispose();grp.remove(c);});
  gBase=null; gText=null;
  const hR=s.ho/2, hX=-s.w/2+Math.max(s.cr,hR)+hR+1.5;
  const shape=rrShape(s.w,s.h,s.cr);
  const hole=new THREE.Path(); hole.absarc(hX,0,hR,0,Math.PI*2,false); shape.holes.push(hole);
  gBase=new THREE.ExtrudeGeometry(shape,{depth:s.th,bevelEnabled:false});
  gBase.translate(0,0,-s.th/2); gBase.computeVertexNormals();
  grp.add(new THREE.Mesh(gBase,matBase));
  const tS=hX+hR+2, tE=s.w/2-2, tW=tE-tS, tCX=(tS+tE)/2;
  if(tW>5){
    gText=buildTextGeo(s.text,tW,s.h*.68,s.td,s.font);
    if(gText){gText.translate(tCX,0,s.th/2);gText.computeVertexNormals();grp.add(new THREE.Mesh(gText,matTxt));}
  }
  const rm=new THREE.Mesh(new THREE.TorusGeometry(hR+.5,.5,8,32),new THREE.MeshStandardMaterial({color:0x555555,metalness:.95,roughness:.1}));
  rm.position.set(hX,0,0); rm.rotation.x=Math.PI/2; grp.add(rm);
  document.getElementById('dimTxt').textContent=`${s.w} × ${s.h} × ${(s.th+s.td).toFixed(1)} mm`;
  setSt(t('stDone')); draw();
}

// ── CAMERA ────────────────────────────────────────────────────
let theta=22,phi=58,radius=195,panX=0,panY=0;
function updCam(){
  const tt=theta*Math.PI/180,p=phi*Math.PI/180;
  cam.position.set(panX+radius*Math.sin(p)*Math.sin(tt),panY+radius*Math.cos(p),radius*Math.sin(p)*Math.cos(tt));
  cam.lookAt(panX,panY,0); draw();
}
function draw(){R.render(scene,cam);}
function onResize(){const vp=cvs.parentElement,W=vp.clientWidth,H=vp.clientHeight;R.setSize(W,H);cam.aspect=W/H;cam.updateProjectionMatrix();draw();}
window.addEventListener('resize',onResize); setTimeout(onResize,0);
let drag=false,rmb=false,lx=0,ly=0;
cvs.addEventListener('mousedown',e=>{drag=true;rmb=e.button===2;lx=e.clientX;ly=e.clientY;});
cvs.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('mousemove',e=>{
  if(!drag)return;const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;
  if(rmb){panX-=dx*.12;panY+=dy*.12;}else{theta-=dx*.4;phi=Math.max(5,Math.min(170,phi+dy*.4));}
  updCam();
});
window.addEventListener('mouseup',()=>drag=false);
cvs.addEventListener('wheel',e=>{radius=Math.max(30,Math.min(600,radius+e.deltaY*.2));updCam();},{passive:true});
updCam();
function setSt(m){document.getElementById('stxt').textContent=m;}

// ── STL ───────────────────────────────────────────────────────
function geoTris(geo){
  const p=geo.attributes.position.array,idx=geo.index?geo.index.array:null,n=idx?idx.length/3:p.length/9,out=[];
  for(let i=0;i<n;i++){
    const a=idx?idx[i*3]:i*3,b=idx?idx[i*3+1]:i*3+1,c=idx?idx[i*3+2]:i*3+2;
    const ax=p[a*3],ay=p[a*3+1],az=p[a*3+2],bx=p[b*3],by=p[b*3+1],bz=p[b*3+2],cx=p[c*3],cy=p[c*3+1],cz=p[c*3+2];
    const ux=bx-ax,uy=by-ay,uz=bz-az,vx=cx-ax,vy=cy-ay,vz=cz-az;
    let nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;
    const nl=Math.sqrt(nx*nx+ny*ny+nz*nz)||1;nx/=nl;ny/=nl;nz/=nl;
    out.push({n:[nx,ny,nz],v:[[ax,ay,az],[bx,by,bz],[cx,cy,cz]]});
  }
  return out;
}
function dlSTL(){
  setSt(t('stExpStl'));
  const tris=[...geoTris(gBase),...(gText?geoTris(gText):[])];
  const buf=new ArrayBuffer(84+tris.length*50),dv=new DataView(buf);
  const h='Keychain Lab'; for(let i=0;i<80;i++) dv.setUint8(i,i<h.length?h.charCodeAt(i):0);
  dv.setUint32(80,tris.length,true); let off=84;
  tris.forEach(tr=>{[tr.n,...tr.v].flat().forEach(v=>{dv.setFloat32(off,v,true);off+=4;});dv.setUint16(off,0,true);off+=2;});
  dl(new Blob([buf],{type:'model/stl'}),`keychain_${gs().text}.stl`);
  setSt(t('stDlStl'));
}

// ── 3MF ───────────────────────────────────────────────────────
async function dl3MF(){
  setSt(t('stExp3mf'));
  const s=gs(),geos=[gBase,gText].filter(Boolean);
  let vx='',tx='',vi=0;
  geos.forEach(geo=>{
    const p=geo.attributes.position.array,idx=geo.index?geo.index.array:null,base=vi;
    for(let i=0;i<p.length;i+=3) vx+=`<vertex x="${p[i].toFixed(4)}" y="${p[i+1].toFixed(4)}" z="${p[i+2].toFixed(4)}"/>`;
    const n=idx?idx.length/3:p.length/9;
    for(let i=0;i<n;i++){const a=(idx?idx[i*3]:i*3)+base,b=(idx?idx[i*3+1]:i*3+1)+base,c=(idx?idx[i*3+2]:i*3+2)+base;tx+=`<triangle v1="${a}" v2="${b}" v3="${c}"/>`;}
    vi+=p.length/3;
  });
  const zip=new JSZip();
  zip.file('[Content_Types].xml',`<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="model" ContentType="application/vnd.ms-package.3dmanufacturing-3dmodel+xml"/></Types>`);
  zip.file('_rels/.rels',`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Type="http://schemas.microsoft.com/3dmanufacturing/2013/01/3dmodel" Target="/3D/3dmodel.model" Id="r1"/></Relationships>`);
  zip.file('3D/3dmodel.model',`<?xml version="1.0" encoding="UTF-8"?><model unit="millimeter" xml:lang="${lang}" xmlns="http://schemas.microsoft.com/3dmanufacturing/core/2015/02"><metadata name="Title">Keychain - ${s.text}</metadata><metadata name="Application">Keychain Lab</metadata><resources><object id="1" type="model"><mesh><vertices>${vx}</vertices><triangles>${tx}</triangles></mesh></object></resources><build><item objectid="1"/></build></model>`);
  dl(await zip.generateAsync({type:'blob',compression:'DEFLATE'}),`keychain_${s.text}.3mf`);
  setSt(t('stDl3mf'));
}

// ── GCODE ─────────────────────────────────────────────────────
function dlGCode(){
  const s=gs(); setSt(t('stExpGc'));
  const totH=s.th+s.td,bLy=Math.ceil(s.th/s.lh),totLy=Math.ceil(totH/s.lh);
  const fr=s.sp*60,eFact=0.04*(s.nw/.4)*(s.lh/.2);
  const BX=110,BY=110,hw=s.w/2,hh=s.h/2,cr=Math.min(s.cr,5);
  const hR=s.ho/2,hX=-hw+Math.max(cr,hR)+hR+1.5,tS=hX+hR+2,tE=hw-2;
  let E=0; const ext=d=>{E+=d*eFact;return E.toFixed(5);};
  let gc=`;== KEYCHAIN LAB GCode ==\n; Text: "${s.text}"  Font: ${selFont.id}\n; ${t('gcDim')}: ${s.w}x${s.h}x${totH.toFixed(2)} mm\n; Layer: ${s.lh}mm  Nozzle: ${s.nw}mm  Speed: ${s.sp}mm/s\n; Temp: ${s.pt}C  Bed: ${s.bt}C\n; Layers: ${totLy} (base: ${bLy}, text: ${totLy-bLy})\n; ${t('gcRec')}\n;=============================\n\nM140 S${s.bt}\nM104 S${s.pt}\nM190 S${s.bt}\nM109 S${s.pt}\nG21\nG90\nM82\nG28\nG92 E0\nG1 Z5 F5000\nG1 X10 Y10 F9000\nG1 Z0.3 F3000\nG92 E0\nG1 X60 Y10 E10 F1500\nG92 E0\nG1 Z3 F3000\n\n`;
  const pts=[[BX-hw+cr,BY-hh],[BX+hw-cr,BY-hh],[BX+hw,BY-hh+cr],[BX+hw,BY+hh-cr],[BX+hw-cr,BY+hh],[BX-hw+cr,BY+hh],[BX-hw,BY+hh-cr],[BX-hw,BY-hh+cr],[BX-hw+cr,BY-hh]];
  for(let ly=1;ly<=totLy;ly++){
    const z=ly*s.lh,isTxt=ly>bLy;
    gc+=`\n; ${t('gcLayer')} ${ly}/${totLy} Z=${z.toFixed(3)} [${isTxt?'TEXT':t('gcBase')}]\nG0 Z${z.toFixed(3)} F1200\n`;
    gc+=`G0 X${pts[0][0].toFixed(3)} Y${pts[0][1].toFixed(3)} F9000\n`;
    for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);gc+=`G1 X${pts[i][0].toFixed(3)} Y${pts[i][1].toFixed(3)} E${ext(d)} F${fr}\n`;}
    if(!isTxt){let y=BY-hh+s.nw,dir=1;while(y<BY+hh-s.nw/2){const sx=dir>0?BX-hw+s.nw:BX+hw-s.nw,ex=dir>0?BX+hw-s.nw:BX-hw+s.nw;gc+=`G0 X${sx.toFixed(3)} Y${y.toFixed(3)} F9000\nG1 X${ex.toFixed(3)} Y${y.toFixed(3)} E${ext(Math.abs(ex-sx))} F${fr}\n`;y+=s.nw*.9;dir=-dir;}}
    else{const tx1=BX+tS,tx2=BX+tE,ty1=BY-s.h*.35,ty2=BY+s.h*.35;let y=ty1+s.nw,dir=1;while(y<ty2-s.nw/2){const sx=dir>0?tx1:tx2,ex=dir>0?tx2:tx1;gc+=`G0 X${sx.toFixed(3)} Y${y.toFixed(3)} F9000\nG1 X${ex.toFixed(3)} Y${y.toFixed(3)} E${ext(Math.abs(ex-sx))} F${(fr*.6).toFixed(0)}\n`;y+=s.nw*.9;dir=-dir;}}
  }
  gc+=`\n; ${t('gcEnd')}\nM104 S0\nM140 S0\nG91\nG1 Z10 F3000\nG90\nG1 X0 Y${BY*2} F9000\nM84\n`;
  dl(new Blob([gc],{type:'text/plain'}),`keychain_${s.text}.gcode`);
  setSt(t('stDlGc'));
}

function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name.replace(/[^a-zA-Z0-9._-]/g,'_');a.click();}

// ── INIT ──────────────────────────────────────────────────────
[['s_td','v_td',1],['s_w','v_w',0],['s_h','v_h',0],['s_th','v_th',1],['s_cr','v_cr',1],
 ['s_ho','v_ho',1],['s_lh','v_lh',2],['s_nw','v_nw',2],['s_pt','v_pt',0],['s_bt','v_bt',0],['s_sp','v_sp',0]
].forEach(([sid,vid,dec])=>{
  const el=document.getElementById(sid);
  el.addEventListener('input',()=>{document.getElementById(vid).textContent=parseFloat(el.value).toFixed(dec);sched();});
});
document.getElementById('iText').addEventListener('input',sched);
let tim=null; function sched(){clearTimeout(tim);tim=setTimeout(rebuild,360);}
buildFontGrid();
applyLang();
document.fonts.ready.then(()=>rebuild());
